<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">ReMe runtime ownership model</title>
  <desc id="desc">Two supported runtime paths lead to a ReMe workspace. A Python host can own an in-process ReMe application, or clients can connect to one independently deployed ReMe service. Only one runtime should own a workspace.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.heading{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.sub{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.lane{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.08em}.title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.text{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.small{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.pill{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.host{fill:#fff;stroke:#94a3b8;stroke-width:2}.boundary{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2}.runtime{fill:#eff6ff;stroke:#2563eb;stroke-width:2.5}.workspace{fill:#ecfdf5;stroke:#10b981;stroke-width:2.5}.rule{fill:#fff7ed;stroke:#f59e0b;stroke-width:1.8;stroke-dasharray:6 4}.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.rule-arrow{fill:none;stroke:#d97706;stroke-width:1.8;stroke-dasharray:6 4;marker-end:url(#arrow-orange)}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#64748b"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#d97706"/></marker>
  </defs>

  <rect class="bg" width="1200" height="650" rx="24"/>
  <text class="heading" x="600" y="50" text-anchor="middle">Choose One Runtime Owner</text>
  <text class="sub" x="600" y="78" text-anchor="middle">Embed ReMe in the host process, or deploy one shared service — never both for the same workspace.</text>

  <rect x="54" y="110" width="1092" height="198" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="1.5"/>
  <text class="lane" x="82" y="140" fill="#7c3aed">PATH A · IN-PROCESS</text>

  <rect class="host" x="82" y="166" width="220" height="104" rx="16"/>
  <text class="title" x="104" y="204">Python host</text>
  <text class="text" x="104" y="232">Python app · AgentScope</text>
  <text class="small" x="104" y="255">owns startup and shutdown</text>

  <rect class="boundary" x="372" y="166" width="244" height="104" rx="16"/>
  <text class="title" x="394" y="204">Python SDK</text>
  <text class="text" x="394" y="232">run_job() · ReMeMiddleware</text>
  <text class="small" x="394" y="255">direct in-process calls</text>

  <rect class="runtime" x="686" y="152" width="270" height="132" rx="18"/>
  <text class="title" x="708" y="194">ReMe Application</text>
  <text class="text" x="708" y="222">one lifecycle inside the host</text>
  <text class="small" x="708" y="248">indexing · jobs · consolidation</text>

  <path class="arrow" d="M302 218H372"/>
  <path class="arrow" d="M616 218H686"/>

  <rect x="54" y="330" width="1092" height="198" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="1.5"/>
  <text class="lane" x="82" y="360" fill="#d97706">PATH B · SHARED SERVICE</text>

  <rect class="host" x="82" y="388" width="220" height="104" rx="16"/>
  <text class="title" x="104" y="426">Agent or app</text>
  <text class="text" x="104" y="454">Claude Code · QwenPaw · client</text>
  <text class="small" x="104" y="477">owns session behavior</text>

  <rect class="boundary" x="372" y="388" width="244" height="104" rx="16"/>
  <text class="title" x="394" y="426">Service boundary</text>
  <text class="text" x="394" y="454">MCP · CLI · HTTP</text>
  <text class="small" x="394" y="477">language-neutral access</text>

  <rect class="runtime" x="686" y="374" width="270" height="132" rx="18"/>
  <text class="title" x="708" y="416">ReMe Service</text>
  <text class="text" x="708" y="444">one lifecycle via reme start</text>
  <text class="small" x="708" y="470">indexing · jobs · consolidation</text>

  <rect class="rule" x="82" y="538" width="534" height="72" rx="14"/>
  <text class="pill" x="104" y="568" fill="#b45309">PLUGINS &amp; SKILLS</text>
  <text class="text" x="104" y="592">decide when an agent should recall or record memory</text>

  <path class="arrow" d="M302 440H372"/>
  <path class="arrow" d="M616 440H686"/>
  <path class="rule-arrow" d="M240 538V492"/>

  <rect class="workspace" x="996" y="230" width="150" height="180" rx="20"/>
  <rect x="1016" y="251" width="110" height="25" rx="12.5" fill="#d1fae5"/>
  <text class="pill" x="1071" y="268" text-anchor="middle" fill="#047857">SHARED DATA</text>
  <text class="title" x="1071" y="311" text-anchor="middle">Workspace</text>
  <text class="text" x="1071" y="340" text-anchor="middle">memory files</text>
  <text class="text" x="1071" y="364" text-anchor="middle">+ derived indexes</text>
  <text class="small" x="1071" y="391" text-anchor="middle">one owner at a time</text>

  <path class="arrow" d="M956 218C980 218 980 272 996 290"/>
  <path class="arrow" d="M956 440C980 440 980 388 996 368"/>

  <rect x="686" y="548" width="460" height="62" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text class="pill" x="708" y="574" fill="#4338ca">IN BOTH PATHS · HOST RESPONSIBILITY</text>
  <text class="text" x="708" y="597">stable session IDs · hooks · recall and record decisions</text>
</svg>
